services:
  - type: web
    name: space-traders-backend
    runtime: python
    plan: free
    branch: main
    buildCommand: echo "No build needed - Python stdlib only"
    startCommand: python -u tools/cloud_storage.py
    envVars:
      - key: DATA_DIR
        value: /opt/render/project/src/data
      - key: PORT
        generateValue: true
